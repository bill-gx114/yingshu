<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1165" viewBox="0 0 1440 1165" role="img" aria-labelledby="title desc">
<title id="title">四种真实文字样式</title><desc id="desc">字幕、贴纸、手记和小人气泡均由 CaptionImageExporter 用原创海岸画面和相同预置文字生成，完整显示。</desc>
<rect x="0" y="0" width="1440" height="1165" rx="24" fill="#f5f1e8" stroke="none"/>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><text x="58" y="57" font-size="16" fill="#e95240" font-weight="600" >02  /  FOUR WAYS TO REMEMBER</text><text x="58" y="119" font-size="42" fill="#25352e" font-weight="600" >同一句感想，四种留法。</text><text x="58" y="159" font-size="21" fill="#6b796d" font-weight="400" >应用真实导出 · 同一张海边图，同一句预置文字</text><rect x="57" y="204" width="650" height="367" rx="1" fill="#d5d9cc" stroke="none"/><image x="58" y="205" width="648" height="364.5" href="images/caption-subtitle.png" preserveAspectRatio="xMidYMid meet"/><text x="58" y="612" font-size="28" fill="#25352e" font-weight="600" >字幕</text><text x="204" y="611" font-size="21" fill="#6b796d" font-weight="400" >沿画面读下去</text><rect x="731" y="204" width="650" height="367" rx="1" fill="#d5d9cc" stroke="none"/><image x="732" y="205" width="648" height="364.5" href="images/caption-sticker.png" preserveAspectRatio="xMidYMid meet"/><text x="732" y="612" font-size="28" fill="#25352e" font-weight="600" >贴纸</text><text x="878" y="611" font-size="21" fill="#6b796d" font-weight="400" >给那一刻贴个标记</text><rect x="57" y="659" width="650" height="367" rx="1" fill="#d5d9cc" stroke="none"/><image x="58" y="660" width="648" height="364.5" href="images/caption-note.png" preserveAspectRatio="xMidYMid meet"/><text x="58" y="1067" font-size="28" fill="#25352e" font-weight="600" >手记</text><text x="204" y="1066" font-size="21" fill="#6b796d" font-weight="400" >留一页安静的回忆</text><rect x="731" y="659" width="650" height="367" rx="1" fill="#d5d9cc" stroke="none"/><image x="732" y="660" width="648" height="364.5" href="images/caption-companion.png" preserveAspectRatio="xMidYMid meet"/><text x="732" y="1067" font-size="28" fill="#25352e" font-weight="600" >小人气泡</text><text x="878" y="1066" font-size="21" fill="#6b796d" font-weight="400" >一位无声的旅行同伴</text><text x="58" y="1122" font-size="20" fill="#6b796d" font-weight="400" >字幕、贴纸、手记与气泡使用应用共用渲染规则；小人动作在 MP4 中保留，PNG 为静态。</text></g></svg>