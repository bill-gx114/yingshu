<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="566" viewBox="0 0 1440 566" role="img" aria-labelledby="title desc">
<title id="title">映述的 R 口述工作流</title><desc id="desc">导入素材，按 R 暂停口述，再按 R 结束，识别完成后在原片段落字并续播，检查并导出。</desc>
<rect x="0" y="0" width="1440" height="566" rx="24" fill="#f5f1e8" stroke="none"/>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><text x="58" y="57" font-size="16" fill="#e95240" font-weight="600" >01  /  THE R WORKFLOW</text><text x="58" y="117" font-size="40" fill="#25352e" font-weight="600" >把一句话，留在刚才的画面。</text><text x="1382" y="112" font-size="18" fill="#6b796d" font-weight="400" text-anchor="end">流程示意</text><rect x="58" y="169" width="310" height="258" rx="16" fill="#fffcf5" stroke="none"/><text x="82" y="210" font-size="21" fill="#6b796d" font-weight="500" >01</text><text x="82" y="276" font-size="29" fill="#25352e" font-weight="600" >导入</text><text x="82" y="333" font-size="21" fill="#6b796d" font-weight="400" >相册 / 本地文件</text><text x="82" y="371" font-size="21" fill="#6b796d" font-weight="400" >照片、视频与实况</text><text x="377" y="305" font-size="27" fill="#9aa995" font-weight="400" >›</text><rect x="396" y="169" width="310" height="258" rx="16" fill="#e95240" stroke="none"/><text x="420" y="210" font-size="21" fill="#ffe3d4" font-weight="500" >02</text><text x="420" y="276" font-size="29" fill="#f5f1e8" font-weight="600" >按 R，说一句</text><text x="420" y="333" font-size="21" fill="#ffe8df" font-weight="400" >画面与配乐暂停</text><text x="420" y="371" font-size="21" fill="#ffe8df" font-weight="400" >表达不赶时间</text><text x="715" y="305" font-size="27" fill="#9aa995" font-weight="400" >›</text><rect x="734" y="169" width="310" height="258" rx="16" fill="#fffcf5" stroke="none"/><text x="758" y="210" font-size="21" fill="#6b796d" font-weight="500" >03</text><text x="758" y="276" font-size="29" fill="#25352e" font-weight="600" >再按 R，落字</text><text x="758" y="333" font-size="21" fill="#6b796d" font-weight="400" >识别完成后绑定原片段</text><text x="758" y="371" font-size="21" fill="#6b796d" font-weight="400" >从刚才的位置续播</text><text x="1053" y="305" font-size="27" fill="#9aa995" font-weight="400" >›</text><rect x="1072" y="169" width="310" height="258" rx="16" fill="#fffcf5" stroke="none"/><text x="1096" y="210" font-size="21" fill="#6b796d" font-weight="500" >04</text><text x="1096" y="276" font-size="29" fill="#25352e" font-weight="600" >检查，带走</text><text x="1096" y="333" font-size="21" fill="#6b796d" font-weight="400" >修文字、选样式与配乐</text><text x="1096" y="371" font-size="21" fill="#6b796d" font-weight="400" >导出 MP4 / PNG</text><text x="58" y="482" font-size="24" fill="#25352e" font-weight="500" >画面与文字共同叙事，配乐负责氛围。</text><text x="58" y="525" font-size="21" fill="#6b796d" font-weight="400" >口述用于转文字；当前成片不包含口述录音和素材原声。</text></g></svg>