<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="970" viewBox="0 0 1440 970" role="img" aria-labelledby="title desc">
<title id="title">三种真实导出画幅</title><desc id="desc">横屏1920×1080、方形1080×1080和竖屏1080×1920，同一素材按比例完整显示，黑边为应用真实导出行为。</desc>
<rect x="0" y="0" width="1440" height="970" rx="24" fill="#192720" stroke="none"/>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><text x="58" y="57" font-size="16" fill="#efa38b" font-weight="600" >03  /  READY TO TAKE WITH YOU</text><text x="58" y="120" font-size="42" fill="#f5f1e8" font-weight="600" >横着看，竖着发，方形收藏。</text><text x="58" y="163" font-size="21" fill="#acbfa8" font-weight="400" >三种画幅的真实 PNG 输出 · 完整显示原素材，比例不同处留黑</text><image x="58" y="255" width="640" height="360" href="images/export-landscape.png" preserveAspectRatio="xMidYMid meet"/><image x="730" y="275" width="330" height="330" href="images/export-square.png" preserveAspectRatio="xMidYMid meet"/><image x="1092" y="220" width="288" height="512" href="images/export-portrait.png" preserveAspectRatio="xMidYMid meet"/><text x="58" y="673" font-size="26" fill="#f5f1e8" font-weight="600" >横屏 16:9</text><text x="58" y="714" font-size="20" fill="#acbfa8" font-weight="400" >1920 × 1080</text><text x="730" y="673" font-size="26" fill="#f5f1e8" font-weight="600" >方形 1:1</text><text x="730" y="714" font-size="20" fill="#acbfa8" font-weight="400" >1080 × 1080</text><text x="1092" y="783" font-size="26" fill="#f5f1e8" font-weight="600" >竖屏 9:16</text><text x="1092" y="824" font-size="20" fill="#acbfa8" font-weight="400" >1080 × 1920</text><rect x="58" y="786" width="978" height="90" rx="13" fill="#273b2c" stroke="none"/><text x="82" y="822" font-size="23" fill="#edf0df" font-weight="500" >MP4：画面 + 文字 + 配乐</text><text x="82" y="857" font-size="20" fill="#acbfa8" font-weight="400" >PNG：静态画面 + 文字，附顺序 / 时间 / 原文索引</text><text x="58" y="926" font-size="20" fill="#93aa91" font-weight="400" >应用 PNG 导出器生成 · 原创海边画面与预置文字 · 完整保留输出画幅</text></g></svg>