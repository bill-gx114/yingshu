<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="868" viewBox="0 0 1440 868" role="img" aria-labelledby="title desc">
<title id="title">本地 AI 模式的处理路径</title><desc id="desc">模型准备完成且未启用可选云端整理时，Qwen3-ASR识别、Qwen2.5整理与媒体渲染均在本机。首次模型准备和公开曲库分别联网。</desc>
<rect x="0" y="0" width="1440" height="868" rx="24" fill="#192720" stroke="none"/>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><text x="58" y="57" font-size="16" fill="#efa38b" font-weight="600" >04  /  LOCAL AI PATH</text><text x="58" y="119" font-size="38" fill="#f5f1e8" font-weight="600" >准备好模型，识别与整理留在本机。</text><rect x="58" y="160" width="1324" height="428" rx="20" fill="#25382b" stroke="#64785e"/><text x="82" y="200" font-size="20" fill="#b5c7ae" font-weight="400" >这台 Mac  /  未开启可选云端整理的独立 AI 模式</text><rect x="84" y="234" width="382" height="180" rx="14" fill="#f5f1e8" stroke="none"/><text x="108" y="282" font-size="30" fill="#25352e" font-weight="600" >识别声音</text><text x="108" y="335" font-size="22" fill="#6b796d" font-weight="400" >Qwen3-ASR · MLX</text><text x="108" y="376" font-size="21" fill="#6b796d" font-weight="400" >麦克风音频暂存在内存</text><rect x="528" y="234" width="382" height="180" rx="14" fill="#f5f1e8" stroke="none"/><text x="552" y="282" font-size="30" fill="#25352e" font-weight="600" >整理表达</text><text x="552" y="335" font-size="22" fill="#6b796d" font-weight="400" >Qwen2.5 · MLX</text><text x="552" y="376" font-size="21" fill="#6b796d" font-weight="400" >保留识别原稿，可检查还原</text><rect x="972" y="234" width="382" height="180" rx="14" fill="#f5f1e8" stroke="none"/><text x="996" y="282" font-size="30" fill="#25352e" font-weight="600" >留在画面</text><text x="996" y="335" font-size="22" fill="#6b796d" font-weight="400" >原生编辑器 + 共享渲染</text><text x="996" y="376" font-size="21" fill="#6b796d" font-weight="400" >预览 / MP4 / 带字 PNG</text><text x="482" y="330" font-size="27" fill="#afc1a7" font-weight="400" >→</text><text x="926" y="330" font-size="27" fill="#afc1a7" font-weight="400" >→</text><text x="84" y="468" font-size="24" fill="#e1ead8" font-weight="500" >声音转成文字，原始录音不写文件、不进项目或成片。</text><text x="84" y="519" font-size="22" fill="#b0c2a9" font-weight="400" >模型仍可能听错或改错；检查未通过时保留完整原稿。</text><rect x="58" y="626" width="646" height="143" rx="14" fill="#2b3b2f" stroke="none"/><rect x="736" y="626" width="646" height="143" rx="14" fill="#2b3b2f" stroke="none"/><text x="82" y="667" font-size="23" fill="#f5f1e8" font-weight="500" >首次准备：联网下载公开模型与运行环境</text><text x="82" y="715" font-size="20" fill="#acbfa8" font-weight="400" >安装包不含模型；约 1.89 GB 模型 + 运行环境</text><text x="760" y="667" font-size="23" fill="#f5f1e8" font-weight="500" >联网曲库：搜索关键词与获取公开音频</text><text x="760" y="715" font-size="20" fill="#acbfa8" font-weight="400" >音乐推荐不发送画面或感想原文</text><text x="58" y="822" font-size="20" fill="#a4b89f" font-weight="400" >本图只描述独立本地 AI 链路；其他语音模式、可选整理与 iCloud 获取范围见语音设置说明。</text></g></svg>